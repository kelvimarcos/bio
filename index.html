    <title>Don Diego Teixeira</title>

    <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">

</head>

<body>

    <!-- Popup de vídeo -->
    <div class="popup-overlay" id="video-popup" role="dialog" aria-modal="true" aria-label="Vídeo">
        <div class="popup-box">
            <div class="story-progress" id="story-progress" aria-hidden="true"></div>
            <button class="popup-close" id="close-popup" aria-label="Fechar">&#x2715;</button>
            <button class="popup-expand" id="popup-expand" aria-label="Tela cheia">&#9974;</button>
            <button class="popup-mute" id="mute-btn" aria-label="Silenciar">🔊</button>
            <video class="popup-video" src="video/video8.mp4" playsinline muted preload="metadata"
                aria-label="Vídeo do Don Diego Style">
                Seu navegador não suporta reprodução de vídeo.
            </video>

        </div>
    </div>

    <!-- Popup dos stories "Passou por aqui" -->
    <div class="video-modal" id="video-modal" role="dialog" aria-modal="true" aria-label="Stories">
        <div class="video-modal__box">
            <div class="video-modal__player" id="video-modal-player"></div>

            <div class="video-modal__bars" id="video-modal-bars" aria-hidden="true"></div>
            <button class="video-modal__close" id="video-modal-close" aria-label="Fechar">&#x2715;</button>
            <button class="video-modal__expand" id="video-modal-expand" aria-label="Tela cheia">&#9974;</button>
            <button class="video-modal__mute" id="video-modal-mute" aria-label="Silenciar">🔊</button>
        </div>
    </div>

    <main class="container">

        <!-- Primeira tela: foto + botões (no desktop ocupa 100vh) -->
        <div class="screen">

        <header class="hero">

            <!-- Topbar: perfil 2 esquerda | compartilhar direita -->
            <div class="topbar">
                <div class="topbar__left">
                    <button class="topbar__perfil" id="open-popup" aria-label="Abrir vídeo">
                        <img src="img/mensagemIcon.png" alt="Conheça o Don Diego">
                    </button>

                    <button class="chat-bubble" id="chat-bubble" type="button" aria-label="Abrir vídeo">
                        <span class="chat-bubble__dots" aria-hidden="true">
                            <span></span><span></span><span></span>
                        </span>
                        <span class="chat-bubble__text">Oopa! 👋</span>
                    </button>
                </div>
                <button class="topbar__share" id="share-btn" aria-label="Compartilhar">
                    <img src="img/compartilhar.png" alt="Compartilhar">
                </button>
            </div>

            <picture>
                <source media="(min-width: 769px)" srcset="img/pc.webp">
                <img class="hero__photo" src="img/foto1.webp" alt="Don Diego">
            </picture>

            <h1 class="hero__welcome">
                Bem-vindo(a)<br> <span class="ajudar">os links irão ajudar </span>
                <span class="arrow-down">&#42780;</span>
            </h1>

        </header>

        <section class="panel" aria-label="Links">
            <div class="cards">
                <a class="link"
                    href="https://wa.me/5582994095090?text=Ol%C3%A1!%20Vim%20pelo%20instagram%20e%20tenho%20interesse%20em%20comprar"
                    target="_blank" rel="noopener noreferrer">
                    <img src="img/img1.webp" alt="imagem de um botão">
                </a>
        
                <a class="link"
                    href="https://wa.me/5582994095090?text=Ol%C3%A1!%20Vim%20pelo%20instagram%20e%20tenho%20interesse%20em%20comprar"
                    target="_blank" rel="noopener noreferrer">
                    <img src="img/img2.webp" alt="imagem de um botão">
                </a>
        
                <a class="link"
                    href="https://wa.me/5582994095090?text=Ol%C3%A1!%20Vim%20pelo%20instagram%20e%20tenho%20interesse%20em%20comprar"
                    target="_blank" rel="noopener noreferrer">
                    <img src="img/img3.webp" alt="imagem de um botão">
                </a>
        
                <a class="link"
                    href="https://wa.me/5582994095090?text=Ol%C3%A1!%20Vim%20pelo%20instagram%20e%20tenho%20interesse%20em%20comprar"
                    target="_blank" rel="noopener noreferrer">
                    <img src="img/img4.webp" alt="imagem de um botão">
                </a>
        
                <a class="link"
                    href="https://wa.me/5582994095090?text=Ol%C3%A1!%20Vim%20pelo%20instagram%20e%20tenho%20interesse%20em%20comprar"
                    target="_blank" rel="noopener noreferrer">
                    <img src="img/img5.webp" alt="imagem de um botão">
                </a>
        
                <a class="link"
                    href="https://wa.me/5582994095090?text=Ol%C3%A1!%20Vim%20pelo%20instagram%20e%20tenho%20interesse%20em%20comprar"
                    target="_blank" rel="noopener noreferrer">
                    <img src="img/img6.webp" alt="imagem de um botão">
                </a>
        
            </div>


        </section>

        </div>
        <!-- /.screen -->

        <!--
            Stories "Passou por Aqui".

            Em cada botão:
              data-type="video" + data-src="URL do .mp4"      -> dura o tempo do vídeo
              data-type="image" + data-src="img/arquivo.webp" -> dura 10s

            O data-src aceita caminho local (img/foto.webp) ou link externo
            (https://cdn.seusite.com/story1.mp4). Para vídeo precisa ser o arquivo
            .mp4 direto, não uma página do YouTube.

            A capa da bolinha é a <img class="story__cover">, trocada à parte.
        -->
        <section class="stories" aria-label="Passou por aqui">
            <h2 class="stories__title">PASSOU POR AQUI</h2>

            <ul class="stories__track">
                <li class="story">
                    <button class="story__btn" type="button" data-type="video" data-src="video/video8.mp4"
                        aria-label="Ver story de Carlinhos Maia">
                        <span class="story__ring">
                            <img class="story__cover" src="img/foto1.webp" alt="" loading="lazy">
                        </span>
                        <span class="story__label">Carlinhos Maia</span>
                    </button>
                </li>
                <li class="story">
                    <button class="story__btn" type="button" data-type="image" data-src="img/foto1.webp"
                        aria-label="Ver story de Nathanzinho Lima">
                        <span class="story__ring">
                            <img class="story__cover" src="img/foto1.webp" alt="" loading="lazy">
                        </span>
                        <span class="story__label">Nathanzinho Lima</span>
                    </button>
                </li>
                <li class="story">
                    <button class="story__btn" type="button" data-type="video" data-src="video/video3.mp4"
                        aria-label="Ver story de Lucas Guimarães">
                        <span class="story__ring">
                            <img class="story__cover" src="img/foto1.webp" alt="" loading="lazy">
                        </span>
                        <span class="story__label">Lucas Guimarães</span>
                    </button>
                </li>
                <li class="story">
                    <button class="story__btn" type="button" data-type="image" data-src="img/pc.webp"
                        aria-label="Ver story de Nuzio">
                        <span class="story__ring">
                            <img class="story__cover" src="img/foto1.webp" alt="" loading="lazy">
                        </span>
                        <span class="story__label">Nuzio</span>
                    </button>
                </li>
                <li class="story">
                    <button class="story__btn" type="button" data-type="image" data-src="img/foto1.webp"
                        aria-label="Ver story de Luciano Camargo">
                        <span class="story__ring">
                            <img class="story__cover" src="img/foto1.webp" alt="" loading="lazy">
                        </span>
                        <span class="story__label">Luciano Camargo</span>
                    </button>
                </li>
            </ul>
        </section>

        <section class="footer">
            <p class="footer__text">©2026 Don Diego Teixeira</p>
        </section>


    </main>
