<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Analytics: as tags antigas (Google Analytics e Microsoft Clarity) foram
         removidas. Cole aqui os novos códigos quando tiver as contas. -->

    <title>Don Diego Teixeira</title>
    <link rel="preconnect" href="https://stream.mux.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
    <link rel="manifest" href="favicon_io/site.webmanifest">
    <link rel="stylesheet" href="style.css?v=62">



</head>

<body>

    <!-- Popup dos stories "Passou por aqui" -->
    <div class="video-modal" id="video-modal" role="dialog" aria-modal="true" aria-label="Stories">
        <div class="video-modal__box">
            <div class="video-modal__player" id="video-modal-player"></div>

            <div class="video-modal__bars" id="video-modal-bars" aria-hidden="true"></div>
            <button class="video-modal__close" id="video-modal-close" aria-label="Fechar">&#x2715;</button>
            <button class="video-modal__expand" id="video-modal-expand" aria-label="Tela cheia">&#9974;</button>
            <button class="video-modal__mute" id="video-modal-mute" aria-label="Ativar som">🔇</button>
            <span class="sound-hint" id="story-sound-hint">Toque para ativar o som</span>
            <span class="media-loading" aria-hidden="true"></span>

            <!-- Fim dos stories do artista: convite para o próximo -->
            <div class="video-modal__end" id="video-modal-end">
                <button class="video-modal__end-btn" id="video-modal-next-group" type="button">
                    <span class="video-modal__end-ring">
                        <svg class="video-modal__end-timer" id="video-modal-timer" viewBox="0 0 100 100"
                            aria-hidden="true">
                            <circle class="video-modal__end-track" cx="50" cy="50" r="46" />
                            <circle class="video-modal__end-run" cx="50" cy="50" r="46" />
                        </svg>
                        <img class="video-modal__end-cover" id="video-modal-end-cover" alt="">
                    </span>
                    <span class="video-modal__end-name" id="video-modal-end-name"></span>
                </button>

                <p class="video-modal__end-hint">
                    Próximo em <span id="video-modal-count">10</span>s
                </p>

                <div class="video-modal__end-actions">
                    <button class="video-modal__end-action" id="video-modal-end-exit" type="button">Sair</button>
                    <button class="video-modal__end-action video-modal__end-action--main" id="video-modal-end-go"
                        type="button">Avançar</button>
                </div>
            </div>
        </div>
    </div>

    <main class="container">

        <!-- Primeira tela: foto + botões (no desktop ocupa 100vh) -->
        <div class="screen">

        <header class="hero">

            <!-- Topbar: perfil 2 esquerda | compartilhar direita -->
            <div class="topbar">
                <div class="topbar__left">
                    <span class="topbar__perfil">
                        <img src="img/mensagemIcon.png" alt="Don Diego Teixeira">
                    </span>

                    <button class="chat-bubble" id="chat-bubble" type="button" aria-label="Dispensar mensagem">
                        <span class="chat-bubble__dots" aria-hidden="true">
                            <span></span><span></span><span></span>
                        </span>
                        <span class="chat-bubble__text">E aí!</span>
                    </button>
                </div>
                <button class="topbar__share" id="share-btn" aria-label="Compartilhar">
                    <img src="img/compartilhar.png" alt="Compartilhar">
                </button>
            </div>

            <picture>
                <source media="(min-width: 769px)" srcset="img/pc.webp">
                <img class="hero__photo" src="img/foto1.webp" alt="Don Diego">
            </picture>

            <h1 class="hero__welcome">
                Bem-vindo(a)<br> <span class="ajudar">os links irão ajudar </span>
                <span class="arrow-down">&#42780;</span>
            </h1>

        </header>

        <section class="panel" id="links" aria-label="Links">
            <div class="cards">
                <a class="link"
                    href="https://wa.me/5582991794334?text=Ol%C3%A1%2C%20vim%20pelo%20site%20e%20gostaria%20de%20mais%20informa%C3%A7%C3%B5es."
                    target="_blank" rel="noopener noreferrer">
                    <img src="img/img1.webp" alt="imagem de um botão">
                </a>

                      <a class="link"
                    href="https://donstyle.com.br/"
                    target="_blank" rel="noopener noreferrer">
                    <img src="img/img6.webp" alt="imagem de um botão">
                </a>
        
                    <a class="link"
                    href="https://www.tiktok.com/@dondiegoteixeira"
                    target="_blank" rel="noopener noreferrer">
                    <img src="img/img5.webp" alt="imagem de um botão">
                </a>
        
                <a class="link"
                    href="https://www.youtube.com/@diegoteixeiradd"
                    target="_blank" rel="noopener noreferrer">
                    <img src="img/img2.webp" alt="imagem de um botão">
                </a>
                
                <a class="link"
                    href="https://www.instagram.com/latavelhadamoda/"
                    target="_blank" rel="noopener noreferrer">
                    <img src="img/img4.webp" alt="imagem de um botão">
                </a>
        
        
                <a class="link"
                    href="https://www.instagram.com/thealfaiate.br/"
                    target="_blank" rel="noopener noreferrer">
                    <img src="img/img3.webp" alt="imagem de um botão">
                </a>
        
            
          
        
            </div>


        </section>

        </div>
        <!-- /.screen -->

        <!--
            Stories "Passou por aqui".

            Cada bolinha é um artista com seus próprios arquivos, listados em
            data-items e separados por barra vertical:

                data-items="video:URL.mp4 | image:img/foto.webp | video:URL2.mp4"

              video:  dura o tempo do próprio arquivo
              image:  dura 10s

            O caminho aceita arquivo local (img/foto.webp) ou link externo
            (https://cdn.seusite.com/story1.mp4). Para vídeo precisa ser o .mp4
            direto, não uma página do YouTube.

            A capa da bolinha é a <img class="story__cover">, trocada à parte.
        -->
        <section class="stories" aria-label="Passou por aqui">
            <h2 class="stories__title">PASSOU POR AQUI</h2>

            <!-- Ordem: por alcance do nome — o maior primeiro, que é quem puxa o clique -->
            <ul class="stories__track">
                <li class="story">
                    <button class="story__btn" type="button"
                        data-items="video:https://stream.mux.com/5BinyuVX9u02n6jcg9P5A6nE1nokyFMLBtMpwayaaG5Y.m3u8"
                        aria-label="Ver stories de Carlinhos Maia">
                        <span class="story__ring">
                            <img class="story__cover" src="img/personalidade3.webp" alt="" loading="lazy">
                        </span>
                        <span class="story__label">Carlinhos Maia</span>
                    </button>
                </li>
                <li class="story">
                    <button class="story__btn" type="button"
                        data-items="video:https://stream.mux.com/Cofrw8k5fKTCrHdg01AhrokoqBBo53h99BfIY2pDn8P4.m3u8"
                        aria-label="Ver stories de Gustavo Lima">
                        <span class="story__ring">
                            <img class="story__cover" src="img/personalidade4.webp" alt="" loading="lazy">
                        </span>
                        <span class="story__label">Gustavo Lima</span>
                    </button>
                </li>
                <li class="story">
                    <button class="story__btn" type="button"
                        data-items="video:https://stream.mux.com/Va9XrIUA9ict3hdEvdAcMRjBgZXqTe01FsbaifYS2RgQ.m3u8 | video:https://stream.mux.com/Q8At4O1H1pT8ltwhOycp88pr02F016pSIZgDamtgVeBBE.m3u8"
                        aria-label="Ver stories de Lucas Guimarães">
                        <span class="story__ring">
                            <img class="story__cover" src="img/personalidade2.webp" alt="" loading="lazy">
                        </span>
                        <span class="story__label">Lucas Guimarães</span>
                    </button>
                </li>
                <li class="story">
                    <button class="story__btn" type="button"
                        data-items="video:https://stream.mux.com/vbdPQzTYXMORrFSq00EoTDBBE76PgQUNmgbR6uxvAlco.m3u8"
                        aria-label="Ver stories de Thiago Freitas">
                        <span class="story__ring">
                            <img class="story__cover" src="img/personalidade1.webp" alt="" loading="lazy">
                        </span>
                        <span class="story__label">Thiago Freitas</span>
                    </button>
                </li>
            </ul>
        </section>

        <section class="footer">
            <p class="footer__text">©2026 Don Diego Teixeira</p>
        </section>


    </main>

    <script defer src="script.js?v=62"></script>
</body>

</html>
