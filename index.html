<body>

    <!-- Popup de vídeo -->
    <div class="popup-overlay" id="video-popup" role="dialog" aria-modal="true" aria-label="Vídeo">
        <div class="popup-box">
            <div class="story-progress" id="story-progress" aria-hidden="true"></div>
            <button class="popup-close" id="close-popup" aria-label="Fechar">&#x2715;</button>
            <button class="popup-mute" id="mute-btn" aria-label="Silenciar">🔊</button>
            <video class="popup-video" src="video/video8.mp4" playsinline muted preload="metadata"
                aria-label="Vídeo do Don Diego Style">
                Seu navegador não suporta reprodução de vídeo.
            </video>

        </div>
    </div>

    <!-- Popup do vídeo do YouTube (stories) -->
    <div class="video-modal" id="video-modal" role="dialog" aria-modal="true" aria-label="Vídeo">
        <div class="video-modal__box">
            <div class="video-modal__bars" id="video-modal-bars" aria-hidden="true"></div>
            <button class="video-modal__close" id="video-modal-close" aria-label="Fechar">&#x2715;</button>

            <button class="video-modal__nav video-modal__nav--prev" id="video-prev"
                aria-label="Vídeo anterior">&#10094;</button>
            <div class="video-modal__player" id="video-modal-player"></div>
            <button class="video-modal__nav video-modal__nav--next" id="video-next"
                aria-label="Próximo vídeo">&#10095;</button>
        </div>
    </div>

    <main class="container">

        <!-- Primeira tela: foto + botões (no desktop ocupa 100vh) -->
        <div class="screen">

        <header class="hero">

            <!-- Topbar: perfil 2 esquerda | compartilhar direita -->
            <div class="topbar">
                <div class="topbar__left">
                    <button class="topbar__perfil" id="open-popup" aria-label="Abrir vídeo">
                        <img src="img/mensagemIcon.png" alt="Conheça o Don Diego">
                    </button>

                    <button class="chat-bubble" id="chat-bubble" type="button" aria-label="Abrir vídeo">
                        <span class="chat-bubble__dots" aria-hidden="true">
                            <span></span><span></span><span></span>
                        </span>
                        <span class="chat-bubble__text">Oopa! 👋</span>
                    </button>
                </div>
                <button class="topbar__share" id="share-btn" aria-label="Compartilhar">
                    <img src="img/compartilhar.png" alt="Compartilhar">
                </button>
            </div>

            <picture>
                <source media="(min-width: 769px)" srcset="img/pc.webp">
                <img class="hero__photo" src="img/foto1.webp" alt="Don Diego">
            </picture>

            <h1 class="hero__welcome">
                Bem-vindo(a)<br> <span class="ajudar">os links irão ajudar </span>
                <span class="arrow-down">&#42780;</span>
            </h1>

        </header>

        <section class="panel" aria-label="Links">
            <div class="cards">
                <a class="link"

                    <img src="img/img1.webp" alt="imagem de um botão">
                </a>
        
                <a class="link"
                    href="https://wa.me/5582994095090?text=Ol%C3%A1!%20Vim%20pelo%20instagram%20e%20tenho%20interesse%20em%20comprar"
                    target="_blank" rel="noopener noreferrer">
                    <img src="img/img2.webp" alt="imagem de um botão">
                </a>

                    href="https://wa.me/5582994095090?text=Ol%C3%A1!%20Vim%20pelo%20instagram%20e%20tenho%20interesse%20em%20comprar"

                    <img src="img/img4.webp" alt="imagem de um botão">

                    <img src="img/img5.webp" alt="imagem de um botão">

                    <img src="img/img6.webp" alt="imagem de um botão">

            </div>


        </section>

        </div>
        <!-- /.screen -->

        <!--
            Vídeos em formato "stories".
            Para trocar a capa de cada bolinha, basta mudar o src da imagem
            (ex.: src="img/capa1.webp"). Para trocar o vídeo, mude o data-video.
        -->
        <section class="stories" aria-label="Vídeos">
            <h2 class="stories__title">Vídeos</h2>

            <ul class="stories__track">
                <li class="story">
                    <button class="story__btn" type="button" data-video="8VLFd2cEIpg" aria-label="Assistir vídeo 1">
                        <span class="story__ring">
                            <img class="story__cover" src="https://i.ytimg.com/vi/8VLFd2cEIpg/mqdefault.jpg" alt=""
                                loading="lazy">
                        </span>
                        <span class="story__label">Carlinhos Maia</span>

                </li>
